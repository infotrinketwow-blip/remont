<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор вартості ремонту</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b; --line:rgba(255,255,255,.12);
  --text:#fff; --muted:#a8a8a8; --accent:#ff4000; --accent-soft:#ff7a4d;
  --teal:#1f5f6b; --teal-2:#2a8794; --ok:#2ecc71; --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;line-height:1.35;overflow-x:hidden;
  background-image:radial-gradient(900px 500px at 80% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),
                   radial-gradient(700px 500px at -10% 30%,color-mix(in srgb,var(--teal) 18%,transparent),transparent 60%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px calc(32px + env(safe-area-inset-bottom))}
.screen{display:none;animation:in .35s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.logo-img{display:block;height:var(--logo-h,30px);width:auto;max-width:60%}
.phone{display:flex;align-items:center;gap:8px;padding:10px 13px;border:1px solid var(--line);border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap;color:var(--text);text-decoration:none}
.phone svg{color:var(--accent);font-size:18px}
h1,h2{text-transform:uppercase;font-weight:700;letter-spacing:.2px}
h1{font-size:clamp(34px,10.5vw,50px);line-height:1.05;margin-bottom:18px}
h1 em{font-style:normal;color:var(--accent)}
.lead{color:var(--muted);font-size:18px;margin-bottom:26px}
.lead b{color:var(--text);font-weight:600}

.live{border:1px solid color-mix(in srgb,var(--teal-2) 55%,transparent);border-radius:24px;padding:22px;margin-bottom:22px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,transparent),rgba(255,255,255,.03) 55%,color-mix(in srgb,var(--teal) 18%,transparent));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 15%,transparent) inset}
.live-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.live-h span:first-child{color:var(--text);display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.live h3{font-size:22px;font-weight:600;margin-bottom:12px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:15px;color:var(--muted)}
.tag.hot{border-color:var(--accent);color:var(--accent-soft)}
.live small{display:block;color:var(--muted);font-size:15px;margin-bottom:4px}
.price{font-size:clamp(28px,8.4vw,38px);font-weight:700;white-space:nowrap}
.price i{font-style:normal;color:var(--accent-soft)}
.live-bar{display:flex;align-items:center;gap:12px;margin-top:16px}
.live-bar div{flex:1;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--accent))}
.gift{width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:24px}

.btn{width:100%;padding:21px 24px;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));
  font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:1.5px;display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 28%,transparent);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;box-shadow:none;cursor:not-allowed}
.btn svg{font-size:22px}
.trust{display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:22px;color:var(--muted);font-size:16px}
.trust span{display:flex;gap:8px;align-items:center}
.trust svg{color:var(--teal-2)}
.trust b{color:var(--text);font-weight:600}

.prog{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.bar{flex:1;height:14px;border-radius:14px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:14px;background:linear-gradient(90deg,var(--teal),var(--teal-2) 40%,var(--accent));transition:width .45s ease}
.gift-s{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:30px;border:2px solid transparent;transition:.3s}
.gift-s.hot{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:17px;margin-bottom:34px;gap:10px}
.meta b{color:var(--accent-soft);font-weight:600}
h2{font-size:clamp(26px,7.6vw,36px);line-height:1.1;margin-bottom:14px}
.sub{color:var(--muted);font-size:19px;margin-bottom:26px}

.opts{display:grid;gap:14px}
.opt{display:flex;align-items:center;gap:18px;text-align:left;width:100%;padding:18px 20px;border-radius:var(--r);
  border:1.5px solid var(--line);background:rgba(18,18,18,.85);position:relative;transition:.2s}
.opt:hover{border-color:rgba(255,255,255,.28)}
.ico{width:62px;height:62px;border-radius:14px;background:var(--teal);display:grid;place-items:center;font-size:30px;flex:none}
.opt .t{font-size:21px;font-weight:600;line-height:1.2}
.opt .d{color:var(--muted);font-size:16px;margin-top:4px}
.chk{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:18px}
.chk svg{opacity:0;stroke-width:3}
.opt.sel{border-color:var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 20%,transparent),color-mix(in srgb,var(--accent) 10%,transparent))}
.opt.sel .chk{background:var(--accent);border-color:var(--accent)}
.opt.sel .chk svg{opacity:1}
/* картка рівня ремонту */
.opt.lv{display:block;padding:22px 22px 20px}
.lv .row{display:flex;justify-content:space-between;align-items:center}
.lv .t{font-size:22px}
.lv .pp{font-size:36px;font-weight:700;color:var(--accent-soft);margin:14px 0 14px}
.lv .pp small{font-size:18px;font-weight:500;color:var(--muted);margin-left:6px}
.lv ul{list-style:none;display:grid;gap:8px;color:#d6d6d6;font-size:17px}
.lv li{display:flex;gap:12px;align-items:baseline}
.lv li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal-2);flex:none;transform:translateY(-2px)}

.sl{border:1.5px solid var(--line);border-radius:22px;padding:30px 22px 26px;background:rgba(18,18,18,.85)}
.big{display:flex;align-items:baseline;justify-content:center;gap:22px;margin-bottom:26px}
.big input{width:150px;background:none;border:0;border-bottom:2px solid var(--line);color:#fff;font:700 64px/1 "Jost",sans-serif;text-align:center;outline:0;padding-bottom:6px;-moz-appearance:textfield}
.big input::-webkit-outer-spin-button,.big input::-webkit-inner-spin-button{-webkit-appearance:none}
.big input:focus{border-color:var(--accent)}
.big span{font-size:26px;color:var(--muted);font-weight:500;align-self:flex-start;margin-top:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:12px;outline:0;
  background:linear-gradient(90deg,var(--accent) var(--p,10%),rgba(255,255,255,.12) var(--p,10%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:#fff;border:7px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.5);cursor:grab}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:7px solid var(--accent);cursor:grab}
.rng{display:flex;justify-content:space-between;color:var(--muted);font-size:16px;margin:12px 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{padding:10px 20px;border-radius:999px;border:1px solid var(--line);font-size:17px;color:var(--muted);transition:.2s}
.chip:hover,.chip.on{border-color:var(--accent);color:#fff}

.nav{display:flex;align-items:center;gap:20px;margin-top:34px}
.back{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:19px;font-weight:500;padding:12px 4px}
.back svg{font-size:24px}
.nav .btn{flex:1}

/* екран розрахунку */
.rhead{display:flex;justify-content:space-between;color:var(--muted);font-size:17px;margin-bottom:26px}
.rhead b{color:var(--accent-soft);font-weight:600}
.eyebrow{color:var(--accent-soft);letter-spacing:3px;text-transform:uppercase;font-size:15px;margin-bottom:12px}
.rc{border:1px solid var(--line);border-radius:24px;padding:24px 22px;background:rgba(18,18,18,.85);margin:24px 0 20px}
.rc .what{color:var(--muted);font-size:18px;margin-bottom:10px}
.rc .big2{font-size:clamp(30px,9.4vw,42px);font-weight:700;line-height:1.12;text-transform:none}
.rc .big2 span{color:#fff}
.rc .big2 i{font-style:normal;color:var(--accent-soft)}
.rc .uah{color:var(--muted);font-size:18px;margin:8px 0 22px}
.sec{border-top:1px solid var(--line);padding-top:20px;margin-top:6px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;font-size:15px;margin-bottom:6px}
.line{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:18px;color:var(--muted)}
.line:last-child{border-bottom:0}
.line b{color:#fff;font-weight:600;text-align:right;white-space:nowrap}
.info{display:flex;gap:14px;padding:18px;border-radius:12px;border-left:3px solid var(--teal-2);background:color-mix(in srgb,var(--teal) 30%,transparent);color:#d6e6e8;font-size:18px;margin-top:16px}
.info svg{color:var(--teal-2);font-size:24px;margin-top:2px}
.info b{color:#fff}
.ans{color:var(--muted);font-size:18px;margin-top:20px}

.lead-card{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:24px;padding:22px;margin-top:6px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,transparent),rgba(18,18,18,.9) 45%)}
.lead-h{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.lead-h .gift{border-radius:16px;width:56px;height:56px;flex:none}
.lead-h h2{font-size:clamp(22px,6.4vw,28px);margin:0}
.ul{list-style:none;display:grid;gap:12px;margin-bottom:24px}
.ul li{display:flex;gap:12px;color:#ddd;font-size:18px}
.ul svg{color:var(--accent-soft);margin-top:3px;font-size:18px}
label.l{display:block;color:var(--muted);font-size:16px;margin:0 0 8px}
.in{width:100%;padding:18px;border-radius:12px;border:1px solid var(--line);background:#0a0a0a;color:#fff;font:500 19px "Jost",sans-serif;outline:0;margin-bottom:18px}
.in:focus{border-color:var(--accent)}
.in.err{border-color:#ff3b30}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.how button{padding:16px 6px;border:1px solid var(--line);border-radius:12px;background:#0a0a0a;font-size:18px;font-weight:500;transition:.2s}
.how button.on{border-color:var(--accent);color:var(--accent-soft)}
.agree{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:15px;margin-bottom:16px}
.agree input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.agree a{color:#fff}
.err-t{color:#ff6b5e;font-size:15px;margin:-8px 0 14px;display:none}

.ok{width:68px;height:68px;border-radius:50%;background:rgba(46,204,113,.15);color:var(--ok);display:grid;place-items:center;font-size:36px;margin-bottom:18px}
.alt{display:grid;gap:12px;margin-top:22px}
.alt a{display:flex;align-items:center;justify-content:center;gap:10px;padding:17px;border:1px solid var(--line);border-radius:14px;color:#fff;text-decoration:none;font-size:18px;font-weight:500}
@media (min-width:640px){.wrap{padding-top:40px}}
</style>
</head>

<div class="wrap">

  <!-- 0. ІНТРО -->
  <section class="screen on" id="s-intro">
    <div class="top">
      <img class="logo-img" alt="">
      <a class="phone" id="ph" href="#"><svg><use href="#i-phone"/></svg><span id="ph-t"></span></a>
    </div>
    <h1 id="i-h1"></h1>
    <p class="lead" id="i-lead"></p>
    <div class="live">
      <div class="live-h"><span><i class="dot"></i><span id="lv-head"></span></span><span id="lv-n"></span></div>
      <h3 id="lv-t"></h3>
      <div class="tags"><span class="tag hot" id="lv-a"></span><span class="tag" id="lv-b"></span></div>
      <small id="lv-cap"></small>
      <div class="price" id="lv-p"></div>
      <div class="live-bar"><div></div><span class="gift"><svg><use href="#i-gift"/></svg></span></div>
    </div>
    <button class="btn" id="start"><span id="i-cta"></span><svg><use href="#i-arrow"/></svg></button>
    <div class="trust" id="i-trust"></div>
  </section>

  <!-- 1. КВІЗ -->
  <section class="screen" id="s-quiz">
    <div class="prog">
      <div class="bar"><i id="bar"></i></div>
      <div class="gift-s" id="gift"><svg><use href="#i-gift"/></svg></div>
    </div>
    <div class="meta"><span id="m-l"></span><span id="m-r"></span></div>
    <h2 id="q-t"></h2>
    <p class="sub" id="q-s"></p>
    <div id="q-body"></div>
    <div class="nav">
      <button class="back" id="back"><svg><use href="#i-back"/></svg><span id="t-back"></span></button>
      <button class="btn" id="next" style="display:none"><span id="t-next"></span><svg><use href="#i-arrow"/></svg></button>
    </div>
  </section>

  <!-- 2. РОЗРАХУНОК + ФОРМА -->
  <section class="screen" id="s-res">
    <div class="rhead"><span id="rh-l"></span><b id="rh-r"></b></div>
    <div class="eyebrow" id="r-eb"></div>
    <h2 id="r-title"></h2>
    <div class="rc">
      <div class="what" id="r-what"></div>
      <div class="big2" id="r-big"></div>
      <div class="uah" id="r-uah"></div>
      <div class="sec" id="r-s1"></div>
      <div id="r-rep"></div>
      <div class="sec" id="r-s2"></div>
      <div id="r-srv"></div>
      <div class="info"><svg><use href="#i-info"/></svg><div id="r-note"></div></div>
      <p class="ans" id="r-ans"></p>
    </div>
    <div class="lead-card" id="lead">
      <div class="lead-h"><span class="gift"><svg><use href="#i-gift"/></svg></span><h2 id="l-title"></h2></div>
      <ul class="ul" id="l-ben"></ul>
      <form id="form" novalidate>
        <label class="l" for="f-name" id="l-nl"></label>

/* ===================== ДОПОМІЖНЕ ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md  = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const fill = (t,o) => String(t ?? "").replace(/\{(\w+)\}/g, (m,k)=> o[k] ?? m);
const sp  = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const r1k = n => Math.round(n/1000)*1000;
function merge(a,b){
  if (Array.isArray(b)) return b.map(x=>x&&typeof x==="object"&&!Array.isArray(x)?merge({},x):x);
  if (b && typeof b==="object"){ const o = (a && typeof a==="object" && !Array.isArray(a)) ? {...a} : {}; for (const k in b) o[k] = merge(o[k], b[k]); return o; }
  return b === undefined ? a : b;
}
const clone = o => JSON.parse(JSON.stringify(o));
const find = (list,id) => (list||[]).find(o=>o.id===id);
const STEP_IDS = ["obj","area","state","lvl","need"];

let C = clone(DEFAULTS);
function readInline(){ try { return JSON.parse($("quiz-config").textContent || "{}"); } catch(_){ return {}; } }
C = merge(C, readInline());

/* ===================== РОЗРАХУНОК ===================== */
function calc(a){
  const P=C.pricing, S=C.steps;
  const o=find(S.obj.options,a.obj), st=find(S.state.options,a.state), lv=find(S.lvl.options,a.lvl);
  const k=(+(st?.k ?? 1))*(+(o?.k ?? 1));
  const works=[P.worksFrom,P.worksTo].map(v=>v*k*a.area);
  const mat=[lv?.from??0,lv?.to??0].map(v=>v*a.area*P.materialsK*(+(st?.m ?? 1)));
  return {
    works, mat, total:[works[0]+mat[0], works[1]+mat[1]],
    design:Math.max(P.designMin, a.area*P.designUahM2),
    watch: Math.max(P.watchMin,  a.area*P.watchUahM2)
  };
}
const cur = () => C.pricing.currency || "$";
const usd = n => cur()+sp(r1k(n));
const priceHtml = t => `<i>${esc(cur())}</i>${sp(r1k(t[0]))} — <i>${esc(cur())}</i>${sp(r1k(t[1]))}`;

/* ===================== СТАН ===================== */
const ans = {};
let step = 0, exI = 0, exTimer = null, screen = "s-intro";
const screens = ["s-intro","s-quiz","s-res","s-done"];
function show(id){ screen=id; screens.forEach(s=>$(s).classList.toggle("on", s===id)); window.scrollTo(0,0); }

/* ===================== ЗАСТОСУВАННЯ КОНФІГУ ===================== */
function applyConfig(){
  const B=C.brand, I=C.intro, U=C.ui, R=C.result, L=C.lead, T=C.thanks;
  const root=document.documentElement.style;
  root.setProperty("--accent",B.accent); root.setProperty("--accent-soft",B.accentSoft);
  root.setProperty("--teal",B.teal); root.setProperty("--teal-2",B.tealLight); root.setProperty("--bg",B.bg);
  root.setProperty("--logo-h",(+B.logoHeight||30)+"px");
  document.title = B.pageTitle;
  document.querySelectorAll(".logo-img").forEach(i=>{ i.src=B.logo; i.alt=B.pageTitle; });
  const tel = "tel:+"+String(B.phone).replace(/\D/g,"");
  $("ph").href=tel; $("ph-t").textContent=B.phone;

  $("i-h1").innerHTML = md(I.title).replace(/<b>(.+?)<\/b>/g,"<em>$1</em>");
  $("i-lead").innerHTML = md(I.lead);
  $("lv-head").textContent=I.liveHead; $("lv-cap").textContent=I.liveCaption;
  $("i-cta").textContent=I.cta;
  $("i-trust").innerHTML = I.trust.map(t=>`<span><svg><use href="#i-check"/></svg>${md(t)}</span>`).join("");
  if (exI>=C.examples.length) exI=0;
  showExample();
  clearInterval(exTimer); if (C.examples.length>1) exTimer=setInterval(()=>{ exI=(exI+1)%C.examples.length; showExample(); },3200);

  $("t-back").textContent=U.back; $("t-next").textContent=U.next; $("t-redo").textContent=L.redo;

  $("rh-l").textContent=R.left; $("rh-r").textContent=R.right; $("r-eb").textContent=R.eyebrow; $("r-title").textContent=R.title;
  $("r-s1").textContent=R.sectionRepair; $("r-s2").textContent=R.sectionServices; $("r-note").innerHTML=md(R.note);

  $("l-title").textContent=L.title;
  $("l-ben").innerHTML=L.benefits.map(b=>`<li><svg><use href="#i-check"/></svg>${esc(b)}</li>`).join("");
  $("l-nl").textContent=L.nameLabel; $("f-name").placeholder=L.namePlaceholder; $("l-pl").textContent=L.phoneLabel;
  $("l-ml").textContent=L.methodLabel; $("f-err").textContent=L.error;
  $("l-ag").textContent=L.agree; $("l-pr").textContent=L.privacyText; $("l-pr").href=L.privacyUrl||"#";
  if (!$("send").disabled) $("send").textContent=L.submit;
  if (!C.lead.methods.includes(how)) how = C.lead.methods[0] || "";
  $("how").innerHTML = L.methods.map(m=>`<button type="button" data-v="${esc(m)}" class="${m===how?"on":""}">${esc(m)}</button>`).join("");
  $("how").style.gridTemplateColumns = `repeat(${Math.max(1,L.methods.length)},1fr)`;

  $("d-s").textContent=T.text;
  const dp=$("d-ph"); dp.href=tel; dp.lastElementChild.textContent=T.callLabel||B.phone;
  const dt=$("d-tg"); dt.href=B.telegram||"#"; dt.lastElementChild.textContent=T.telegramLabel; dt.style.display=B.telegram?"":"none";
  $("again").lastElementChild.textContent=T.showLabel;

  // прибрати відповіді, яких більше немає у списках
  ["obj","state","lvl","need"].forEach(k=>{ if (ans[k] && !find(C.steps[k].options, ans[k])) delete ans[k]; });
  if (ans.area==null) ans.area=+C.steps.area.default;

  if (screen==="s-quiz") renderStep();
  if (screen==="s-res") renderResult();
}

function showExample(){
  const e=C.examples[exI]; if(!e){ return; }
  const lv=find(C.steps.lvl.options,e.lvl), st=find(C.steps.state.options,e.state);
  $("lv-n").textContent=`${C.intro.exampleWord} ${exI+1}/${C.examples.length}`;
  $("lv-t").textContent=e.title;
  $("lv-a").textContent=lv?.label||""; $("lv-b").textContent=st?.short||st?.label||"";
  try { $("lv-p").innerHTML=priceHtml(calc({obj:e.obj,area:+e.area,state:e.state,lvl:e.lvl}).total); } catch(_){}
}

/* ===================== КВІЗ ===================== */
const word = (n,w) => n===1 ? w[0] : (n<5 ? w[1] : w[2]);
function renderStep(){
  const id=STEP_IDS[step], S=C.steps[id], total=STEP_IDS.length, U=C.ui;
  $("bar").style.width = Math.max(6,(step/total)*100)+"%";
  $("m-l").textContent = `${U.question} ${step+1} ${U.of} ${total}`;
  const left=total-step;
  $("m-r").innerHTML = step===total-1 ? md(U.lastStep) : md(fill(U.stepsLeft,{n:left,w:word(left,U.stepWords)}));
  $("gift").classList.toggle("hot", step===total-1);
  $("q-t").textContent=S.title; $("q-s").textContent=S.sub;
  const body=$("q-body"); body.innerHTML=""; $("next").style.display="none";

  if (id==="area"){
    const mn=+S.min||20, mx=+S.max||300;
    body.innerHTML=`<div class="sl">
      <div class="big"><input id="a-n" type="number" inputmode="numeric" min="1" max="5000" value="${ans.area}"><span>${esc(U.unit)}</span></div>
      <input id="a-r" type="range" min="${mn}" max="${mx}" value="${Math.min(Math.max(ans.area,mn),mx)}">
      <div class="rng"><span>${mn} ${esc(U.unit)}</span><span>${mx}+ ${esc(U.unit)}</span></div>
      <div class="chips">${(S.presets||[]).map(v=>`<button class="chip" data-v="${v}">${v} ${esc(U.unit)}</button>`).join("")}</div></div>`;
    const r=$("a-r"), n=$("a-n");
    const paint=()=>{ r.style.setProperty("--p", ((Math.min(Math.max(r.value,mn),mx)-mn)/(mx-mn)*100)+"%");
      body.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",+c.dataset.v===ans.area)); };
    r.oninput=()=>{ ans.area=+r.value; n.value=r.value; paint(); };
    n.oninput=()=>{ const v=Math.min(5000,+n.value||0); ans.area=v; r.value=Math.min(Math.max(v,mn),mx); paint(); };
    body.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ ans.area=+c.dataset.v; n.value=ans.area; r.value=ans.area; paint(); });
    paint(); $("next").style.display=""; return;
  }

  const w=document.createElement("div"); w.className="opts";
  S.options.forEach(o=>{
    const b=document.createElement("button");
    const chk=`<span class="chk"><svg><use href="#i-check"/></svg></span>`;
    if (id==="lvl"){
      b.className="opt lv"+(ans.lvl===o.id?" sel":"");
      b.innerHTML=`<div class="row"><div class="t">${esc(o.label)}</div>${chk}</div>
        <div class="pp">${esc(o.priceText)}<small>${esc(U.perM2)}</small></div>
        <ul>${(o.items||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    } else {
      b.className="opt"+(ans[id]===o.id?" sel":"");
      b.innerHTML=`<span class="ico"><svg><use href="#i-${esc(o.icon||"q")}"/></svg></span>
        <span><div class="t">${esc(o.label)}</div>${o.desc?`<div class="d">${esc(o.desc)}</div>`:""}</span>${chk}`;
    }
    b.onclick=()=>{ ans[id]=o.id; w.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); setTimeout(next,280); };
    w.appendChild(b);
  });
  body.appendChild(w);
}
function next(){
  if (STEP_IDS[step]==="area" && !(ans.area>=1)){ $("a-n").focus(); return; }
  if (step<STEP_IDS.length-1){ step++; renderStep(); window.scrollTo(0,0); }
  else { renderResult(); show("s-res"); }
}
function prev(){ if(step===0){ show("s-intro"); return; } step--; renderStep(); window.scrollTo(0,0); }

/* ===================== РЕЗУЛЬТАТ ===================== */
function complete(){ return ["obj","state","lvl","need"].every(k=>ans[k]) && ans.area>=1; }
function renderResult(){
  if (!complete()) return;
  const R=C.result, S=C.steps, c=calc(ans);
  const need=find(S.need.options,ans.need), lv=find(S.lvl.options,ans.lvl);
  $("r-what").textContent=fill(R.what,{need:need.resultLabel||need.label, area:ans.area});
  $("r-big").innerHTML=`<span>${esc(R.from)}</span> <i>${esc(cur())}${sp(r1k(c.total[0]))}</i><br><span>${esc(R.to)}</span> <i>${esc(cur())}${sp(r1k(c.total[1]))}</i>`;
  const rate=+C.pricing.usdUah||0, r10=n=>sp(Math.round(n*rate/10000)*10000);
  $("r-uah").textContent = rate ? `≈ ${r10(c.total[0])} ₴ — ${r10(c.total[1])} ₴` : "";
  const rng=t=>`${usd(t[0])} — ${usd(t[1])}`;
  $("r-rep").innerHTML=`<div class="line"><span>${esc(R.works)}</span><b>${rng(c.works)}</b></div>
    <div class="line"><span>${esc(fill(R.materials,{lvl:lv.label}))}</span><b>${rng(c.mat)}</b></div>`;
  const uah=n=>sp(Math.round(n/1000)*1000)+" ₴";
  const srv=(need.design?`<div class="line"><span>${esc(R.design)}</span><b>${uah(c.design)}</b></div>`:"")+
            (need.watch?`<div class="line"><span>${esc(R.watch)}</span><b>${uah(c.watch)}</b></div>`:"");
  $("r-srv").innerHTML=srv; $("r-s2").style.display=srv?"":"none";
  $("r-ans").textContent=fill(R.answers,{
    obj:find(S.obj.options,ans.obj).short||find(S.obj.options,ans.obj).label, area:ans.area,
    state:find(S.state.options,ans.state).short||find(S.state.options,ans.state).label, lvl:lv.label});
}

$("start").onclick=()=>{ step=0; renderStep(); show("s-quiz"); };
$("next").onclick=next; $("back").onclick=prev;
$("redo").onclick=()=>{ step=0; renderStep(); show("s-quiz"); };
$("again").onclick=e=>{ e.preventDefault(); show("s-res"); };

/* ===================== ФОРМА ===================== */
let how="";
$("how").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; how=b.dataset.v;
  $("how").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); };
const tel=$("f-tel");
tel.addEventListener("input",()=>{
  let d=tel.value.replace(/\D/g,""); if(d.startsWith("380")) d=d.slice(3); else if(d.startsWith("0")) d=d.slice(1); d=d.slice(0,9);
  let o="+380 ("; if(d.length){ o+=d.slice(0,2); if(d.length>=2) o+=") "+d.slice(2,5); if(d.length>=5) o+="-"+d.slice(5,7); if(d.length>=7) o+="-"+d.slice(7,9); }
  tel.value=o; });
tel.addEventListener("focus",()=>{ if(!tel.value) tel.value="+380 ("; });

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const name=$("f-name").value.trim(), digits=tel.value.replace(/\D/g,"");
  const badName=name.length<2, badTel=digits.length!==12;
  $("f-name").classList.toggle("err",badName); tel.classList.toggle("err",badTel);
  $("f-err").style.display=(badName||badTel)?"block":"none";
  if (badName||badTel||!$("f-ok").checked||!complete()) return;
  const c=calc(ans), S=C.steps, lbl=(k)=>find(S[k].options,ans[k]).label;
  const lead={ name, phone:tel.value, contact:how, object:lbl("obj"), area:ans.area, state:lbl("state"), level:lbl("lvl"), need:lbl("need"),
    estimate:`${usd(c.total[0])} — ${usd(c.total[1])}`, page:location.href, at:new Date().toISOString() };
  const btn=$("send"); btn.disabled=true; btn.textContent=C.lead.sending;
  try { await submit(lead); } catch(err){ console.warn("Не вдалося надіслати:",err); }
  try { localStorage.setItem("remont_last_lead",JSON.stringify(lead)); } catch(_){}
  btn.disabled=false; btn.textContent=C.lead.submit;
  $("d-t").textContent=fill(C.thanks.title,{name}); show("s-done");
});
async function submit(lead){
  const X=C.integrations, jobs=[];
  if (X.submitUrl) jobs.push(fetch(X.submitUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lead)}));
  if (X.tgToken && X.tgChat){
    const text=["🔥 Нова заявка з квізу",`👤 ${lead.name}`,`📞 ${lead.phone} (${lead.contact})`,`🏠 ${lead.object}, ${lead.area} м²`,
      `🧱 ${lead.state} · ${lead.level}`,`🎯 ${lead.need}`,`💰 ${lead.estimate}`].join("\n");
    jobs.push(fetch(`https://api.telegram.org/bot${X.tgToken}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:X.tgChat,text})}));
  }
  if (!jobs.length) console.info("Заявка (канал надсилання не налаштований):",lead);
  await Promise.all(jobs);
}

/* ===================== ЗАВАНТАЖЕННЯ КОНФІГУ ===================== */
applyConfig();
// Файл quiz-config.json поруч зі сторінкою (його створює адмінка) має пріоритет над вбудованим
if (/^https?:$/.test(location.protocol) && !new URLSearchParams(location.search).has("embed")){
  fetch("quiz-config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if(j){ C=merge(clone(DEFAULTS),j); applyConfig(); } }).catch(()=>{});
}
// Живий перегляд з admin.html
const SAMPLE = ()=>({ obj:C.steps.obj.options[0]?.id, state:C.steps.state.options[0]?.id, lvl:C.steps.lvl.options[1]?.id||C.steps.lvl.options[0]?.id, need:C.steps.need.options[2]?.id||C.steps.need.options[0]?.id, area:150 });
window.addEventListener("message",e=>{
  const d=e.data||{};
  if (d.type==="admin-hello" && window.parent!==window) parent.postMessage({type:"quiz-ready",defaults:DEFAULTS},"*");
  if (d.type==="quiz-config"){ C=merge(clone(DEFAULTS),d.config||{}); applyConfig(); }
  if (d.type==="quiz-goto"){
    const g=d.screen;
    if (g==="intro") show("s-intro");
    else if (g.startsWith("step")){ step=+g.slice(4); renderStep(); show("s-quiz"); }
    else if (g==="result"||g==="done"){ if(!complete()) Object.assign(ans,SAMPLE()); renderResult(); show(g==="result"?"s-res":"s-done"); $("d-t").textContent=fill(C.thanks.title,{name:"Іван"}); }
  }
});
if (window.parent!==window) parent.postMessage({type:"quiz-ready",defaults:DEFAULTS},"*");
</script>
</body>
</html>
