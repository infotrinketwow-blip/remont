<!doctype html>

<meta charset="utf-8">

<title>Адмінка квізу — remont.</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--panel:#141414;--line:rgba(255,255,255,.12);--text:#fff;--muted:#9b9b9b;--accent:#ff4000;--ok:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Jost",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;line-height:1.35}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#0f0f0fee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar h1{font-size:20px;font-weight:700;margin-right:auto}
.bar h1 b{color:var(--accent)}
.status{font-size:14px;color:var(--muted)}
.status.ok{color:var(--ok)}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#1b1b1b;font-weight:500;font-size:15px}
.btn:hover{border-color:#fff4}
.btn.pri{background:var(--accent);border-color:var(--accent);font-weight:600}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.danger:hover{border-color:#ff3b30;color:#ff6b5e}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:24px;max-width:1280px;margin:0 auto;padding:20px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:15px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pane{display:none}.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h3{font-size:17px;margin-bottom:14px}
.card>p.help{color:var(--muted);font-size:14px;margin:-6px 0 14px}
.f{margin-bottom:14px}
.f>label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.f .hint{font-size:13px;color:#777;margin-top:5px}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0a0a0a;color:#fff;font:inherit;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
input[type=color]{width:100%;height:42px;border:1px solid var(--line);background:#0a0a0a;border-radius:10px;padding:3px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#101010}
.item-h{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.item-h b{margin-right:auto;font-size:15px;font-weight:600}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:#0a0a0a;font-size:22px}
.ic.on{background:#1f5f6b;border-color:#2a8794}
.logo-prev{background:#000;border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:10px;text-align:left}
.logo-prev img{height:40px;display:block}
/* превʼю */
.pv{position:sticky;top:78px;align-self:start}
.pv-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pv-nav button{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#141414;font-size:13px;color:var(--muted)}
.pv-nav button.on{color:#fff;border-color:var(--accent)}
.phone{width:100%;height:calc(100vh - 170px);min-height:560px;border:1px solid var(--line);border-radius:26px;background:#000;overflow:hidden}
.phone iframe{width:100%;height:100%;border:0;display:block}
.toggle-pv{display:none}
.warn{background:#2b1a14;border:1px solid #ff4000;border-radius:10px;padding:12px;font-size:14px;margin-bottom:14px;display:none}
code{background:#222;padding:1px 6px;border-radius:5px;font-size:13px}
@media (max-width:980px){
  .layout{grid-template-columns:1fr;padding:14px}
  .pv{position:fixed;inset:60px 0 0 0;z-index:30;background:var(--bg);padding:12px;display:none}
  .pv.show{display:block}
  .phone{height:calc(100vh - 150px)}
  .toggle-pv{display:inline-block}
}
</style>
</head>

const clone = o => JSON.parse(JSON.stringify(o));
function merge(a,b){
  if (Array.isArray(b)) return clone(b);
  if (b && typeof b==="object"){ const o=(a&&typeof a==="object"&&!Array.isArray(a))?{...a}:{}; for(const k in b) o[k]=merge(o[k],b[k]); return o; }
  return b===undefined?a:b;
}
const getp=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{ const ks=p.split("."); let a=o; for(let i=0;i<ks.length-1;i++) a=a[ks[i]]; a[ks[ks.length-1]]=v; };
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===================== РЕНДЕР ПОЛІВ ===================== */
let pushT=null, saveT=null;
function changed(){
  clearTimeout(pushT); pushT=setTimeout(()=>$("frame").contentWindow.postMessage({type:"quiz-config",config:cfg},"*"),120);
  clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(DRAFT_KEY,JSON.stringify(cfg)); setStatus("Чернетку збережено в цьому браузері. Щоб опублікувати — завантажте файл угорі.",true);}catch(_){ setStatus("Не вдалося зберегти чернетку",false);} },400);
}
function setStatus(t,ok){ const s=$("status"); s.textContent=t; s.className="status"+(ok?" ok":""); }

function field(f, base){
  const path=(base?base+".":"")+f.k;
  const wrap=document.createElement("div"); wrap.className="f";
  const lab=(txt)=>`<label>${esc(txt)}</label>`;
  const hint=f.hint?`<div class="hint">${esc(f.hint)}</div>`:"";
  const val=getp(cfg,path);
  const set=v=>{ setp(cfg,path,v); changed(); };
  switch(f.t){
    case "row": case "row3":{ const r=document.createElement("div"); r.className=f.t==="row"?"row2":"row3"; f.f.forEach(x=>r.appendChild(field(x,base))); return r; }
    case "note": wrap.innerHTML=`<div class="hint">${esc(f.text)}</div>`; return wrap;
    case "text": wrap.innerHTML=lab(f.label)+`<input type="text">${hint}`; { const i=wrap.querySelector("input"); i.value=val??""; i.oninput=()=>set(i.value); } break;
    case "area": wrap.innerHTML=lab(f.label)+`<textarea></textarea>${hint}`; { const i=wrap.querySelector("textarea"); i.value=val??""; i.oninput=()=>set(i.value); } break;
    case "num": wrap.innerHTML=lab(f.label)+`<input type="number" step="any">${hint}`; { const i=wrap.querySelector("input"); i.value=val??0; i.oninput=()=>set(i.value===""?0:+i.value); } break;
    case "color": wrap.innerHTML=lab(f.label)+`<input type="color">`; { const i=wrap.querySelector("input"); i.value=val||"#000000"; i.oninput=()=>set(i.value); } break;
    case "bool": wrap.innerHTML=`<label class="chk"><input type="checkbox"><span>${esc(f.label)}</span></label>`; { const i=wrap.querySelector("input"); i.checked=!!val; i.onchange=()=>set(i.checked); } break;
    case "lines": wrap.innerHTML=lab(f.label)+`<textarea></textarea>${hint}`; { const i=wrap.querySelector("textarea"); i.value=(val||[]).join("\n"); i.oninput=()=>set(i.value.split("\n").map(x=>x.trim()).filter(Boolean)); } break;
    case "nums": wrap.innerHTML=lab(f.label)+`<input type="text">${hint}`; { const i=wrap.querySelector("input"); i.value=(val||[]).join(", "); i.oninput=()=>set(i.value.split(/[,\s]+/).map(Number).filter(n=>n>0)); } break;
    case "ref": { wrap.innerHTML=lab(f.label)+`<select></select>`; const s=wrap.querySelector("select");
      (getp(cfg,f.ref)||[]).forEach(o=>{ const op=document.createElement("option"); op.value=o.id; op.textContent=o.label; s.appendChild(op); });
      s.value=val; s.onchange=()=>set(s.value); break; }
    case "icon": { wrap.innerHTML=lab(f.label)+`<div class="icons"></div>`; const box=wrap.querySelector(".icons");
      ICONS.forEach(n=>{ const b=document.createElement("button"); b.type="button"; b.className="ic"+(val===n?" on":""); b.title=n; b.innerHTML=`<svg><use href="#i-${n}"/></svg>`;
        b.onclick=()=>{ set(n); box.querySelectorAll(".ic").forEach(x=>x.classList.remove("on")); b.classList.add("on"); }; box.appendChild(b); }); break; }
    case "img": { wrap.innerHTML=lab(f.label)+`<div class="logo-prev"><img alt=""></div><input type="file" accept="image/*"><div style="margin-top:8px"><button type="button" class="btn sm" id="rst">Повернути стандартний</button></div>`;
      const img=wrap.querySelector("img"), file=wrap.querySelector("input");
      img.src=val;
      file.onchange=()=>{ const fl=file.files[0]; if(!fl) return; const fr=new FileReader();
        fr.onload=()=>{ if(fl.type==="image/svg+xml"){ set(fr.result); img.src=fr.result; return; }
          const im=new Image(); im.onload=()=>{ const w=Math.min(800,im.width), h=Math.round(im.height*w/im.width), cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(im,0,0,w,h);
            const d=cv.toDataURL("image/png"); set(d); img.src=d; }; im.src=fr.result; };
        fr.readAsDataURL(fl); };
      wrap.querySelector("#rst").onclick=()=>{ set(getp(DEF,path)); img.src=getp(DEF,path); };
      break; }
  }
  return wrap;
}

function listEditor(L, host){
  const draw=()=>{
    host.innerHTML="";
    const arr=getp(cfg,L.path);
    arr.forEach((it,idx)=>{
      const card=document.createElement("div"); card.className="item";
      const h=document.createElement("div"); h.className="item-h";
      h.innerHTML=`<b>${esc(L.item)} ${idx+1}${it.label?" — "+esc(it.label):it.title?" — "+esc(it.title):""}</b>`;
      const mk=(txt,fn,cls="")=>{ const b=document.createElement("button"); b.type="button"; b.className="btn sm "+cls; b.textContent=txt; b.onclick=fn; h.appendChild(b); };
      mk("↑",()=>{ if(idx>0){ [arr[idx-1],arr[idx]]=[arr[idx],arr[idx-1]]; changed(); redrawAll(); } });
      mk("↓",()=>{ if(idx<arr.length-1){ [arr[idx+1],arr[idx]]=[arr[idx],arr[idx+1]]; changed(); redrawAll(); } });
      mk("✕",()=>{ if(arr.length<=1){ alert("Має лишитися хоча б один пункт."); return; }
        if(!confirm("Видалити цей пункт?")) return; arr.splice(idx,1); changed(); redrawAll(); },"danger");
      card.appendChild(h);
      L.fields.forEach(f=>card.appendChild(field(f,L.path+"."+idx)));
      host.appendChild(card);
    });
    const add=document.createElement("button"); add.type="button"; add.className="btn"; add.textContent="+ Додати";
    add.onclick=()=>{ arr.push(L.newItem()); changed(); redrawAll(); }; host.appendChild(add);
  };
  draw();
}
function redrawAll(){ const y=window.scrollY; build(); window.scrollTo(0,y); }

/* ===================== ЗБІРКА СТОРІНКИ ===================== */
const SCREEN_BTNS=[["intro","Старт"],["step0","1"],["step1","2"],["step2","3"],["step3","4"],["step4","5"],["result","Розрахунок"],["done","Дякуємо"]];
function goto(s){ $("frame").contentWindow.postMessage({type:"quiz-goto",screen:s},"*");
  $("pv-nav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.s===s)); }

function build(){
  const tabs=$("tabs"), panes=$("panes"); tabs.innerHTML=""; panes.innerHTML="";
  TABS.forEach(tab=>{
    const b=document.createElement("button"); b.className="tab"+(tab.id===activeTab?" on":""); b.textContent=tab.name;
    b.onclick=()=>{ activeTab=tab.id; document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
      document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.dataset.id===tab.id)); goto(tab.screen); };
    tabs.appendChild(b);
    const pane=document.createElement("section"); pane.className="pane"+(tab.id===activeTab?" on":""); pane.dataset.id=tab.id;
    tab.blocks.forEach(bl=>{
      const card=document.createElement("div"); card.className="card";
      card.innerHTML=`<h3>${esc(bl.title)}</h3>${bl.help?`<p class="help">${esc(bl.help)}</p>`:""}`;
      if (bl.custom==="system") systemBlock(card);
      else if (bl.list){ const host=document.createElement("div"); card.appendChild(host); listEditor(bl.list,host); }
      else (bl.fields||[]).forEach(f=>card.appendChild(field(f,"")));
      pane.appendChild(card);
      if (bl.screen) card.addEventListener("focusin",()=>goto(bl.screen));
    });
    panes.appendChild(pane);
  });
}

function systemBlock(card){
  card.innerHTML+=`<p class="help">Усі налаштування — це один файл <code>quiz-config.json</code>. Збережіть його як резервну копію або перенесіть на інший комп’ютер.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="s-exp">⬇ Зберегти налаштування</button>
      <label class="btn" style="cursor:pointer">⬆ Завантажити налаштування<input type="file" id="s-imp" accept=".json,application/json" hidden></label>
      <button class="btn" id="s-copy">Скопіювати JSON</button>
      <button class="btn danger" id="s-rst">Скинути до стандартних</button>
    </div>`;
  card.querySelector("#s-exp").onclick=()=>download("quiz-config.json",JSON.stringify(cfg,null,2),"application/json");
  card.querySelector("#s-copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(cfg,null,2)); setStatus("JSON скопійовано",true);}catch(_){ setStatus("Не вдалося скопіювати",false);} };
  card.querySelector("#s-imp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ cfg=merge(clone(DEF),JSON.parse(r.result)); changed(); build(); setStatus("Налаштування завантажено",true);}catch(_){ alert("Це не схоже на файл налаштувань."); } }; r.readAsText(f); };
  card.querySelector("#s-rst").onclick=()=>{ if(confirm("Скинути ВСІ зміни до стандартних значень?")){ cfg=clone(DEF); try{localStorage.removeItem(DRAFT_KEY);}catch(_){} changed(); build(); } };
}

function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type+";charset=utf-8"})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
$("b-json").onclick=()=>download("quiz-config.json",JSON.stringify(cfg,null,2),"application/json");
$("b-html").onclick=async()=>{
  try{
    const res=await fetch("quiz.html",{cache:"no-store"}); if(!res.ok) throw 0;
    let html=await res.text();
    const json=JSON.stringify(cfg).replace(/</g,"\\u003c");
    const re=/(<script id="quiz-config" type="application\/json">)[\s\S]*?(<\/script>)/;
    if(!re.test(html)) throw 0;
    download("quiz.html",html.replace(re,(m,a,b)=>a+json+b),"text/html");
  }catch(_){
    alert("Файл quiz.html не вдалося прочитати (так буває, коли адмінка відкрита як файл з диска). Завантажте quiz-config.json і покладіть його поруч з quiz.html на сайті — квіз підхопить його автоматично.");
  }
};
$("tpv").onclick=()=>$("pv").classList.toggle("show");

/* ===================== СТАРТ ===================== */
$("pv-nav").innerHTML=SCREEN_BTNS.map(([s,n])=>`<button data-s="${s}">${n}</button>`).join("");
$("pv-nav").onclick=e=>{ const b=e.target.closest("button"); if(b) goto(b.dataset.s); };
window.addEventListener("message",e=>{
  if(!e.data||e.data.type!=="quiz-ready"||cfg) return;
  DEF=e.data.defaults; cfg=clone(DEF);
  try{ const d=localStorage.getItem(DRAFT_KEY); if(d) cfg=merge(cfg,JSON.parse(d)); }catch(_){}
  $("warn").style.display="none"; build(); changed(); setStatus("Готово. Зміни видно в перегляді праворуч.",true);
});
$("frame").addEventListener("load",()=>$("frame").contentWindow.postMessage({type:"admin-hello"},"*"));
setTimeout(()=>{ if(!cfg){ $("warn").style.display="block"; setStatus("Квіз не завантажився",false); } },4000);
</script>
